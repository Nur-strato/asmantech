# Smoke-тесты Playwright (см. docs/testing.md).
# Ничего не блокирует: Vercel деплоит как обычно, здесь только проверка и уведомление.
name: E2E smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # ручной запуск со вкладки Actions

# Несколько пушей подряд — проверяем только последний, экономим минуты
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Кэш браузеров Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Установка Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Системные зависимости Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Сборка
        run: npm run build

      - name: Тесты
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_SKIP_BUILD: "1"

      - name: Отчёт при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
